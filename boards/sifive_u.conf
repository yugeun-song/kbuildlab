# SiFive HiFive Unleashed (FU540): kbuildlab run TREE --board sifive_u.  tree.conf
# grammar; every value here wins over the tree's for that run.  OpenSBI, QEMU's
# default firmware, starts the kernel directly on a device tree QEMU generates,
# with an is25wp256 SPI NOR on spi0 that needs no argument.
ARCH=riscv64
MACHINE=sifive_u
CPU=                        # empty: the SoC's own E51 and U54 harts
CONSOLE=ttySIF0
CONSOLE_UART=0
NIC_MODEL=cadence_gem       # the GEM, as -nic user,model=
PERSIST_DRIVE=if=sd,bus=0   # /persist as the SD card on spi1, in SPI mode
FW_CFG=0
PCI=0
GDB_INFERIOR=2              # gdb sees the E51 cluster as inferior 1, the U54s as 2
# One E51 and one U54, the fewest the machine takes; --smp and --mem still win.
SMP=2
MEM=2G
KCONFIG=CONFIG_CLK_SIFIVE_PRCI CONFIG_SERIAL_SIFIVE CONFIG_SERIAL_SIFIVE_CONSOLE CONFIG_MACB
