# NXP i.MX 8M Plus EVK: kbuildlab run TREE --board imx8mp-evk.  tree.conf grammar;
# every value here wins over the tree's for that run.  QEMU runs no U-Boot or TF-A
# on this machine, so the kernel boots directly on the tree's own EVK device tree.
ARCH=arm64
MACHINE=imx8mp-evk
CPU=                        # empty: the SoC's own Cortex-A53
CONSOLE=ttymxc1             # the console device, on UART2
CONSOLE_UART=1              # that UART's index among the board's, from 0
DTB=arch/arm64/boot/dts/freescale/imx8mp-evk.dtb   # relative to the tree's source
NIC_MODEL=imx.enet          # the FEC, as -nic user,model=
PERSIST_DRIVE=if=sd,bus=1   # /persist in the SD slot (USDHC2); bus=2 is the eMMC slot
FW_CFG=0                    # none: no vmcoreinfo, so drgn has no way in
PCI=0                       # one DesignWare root port, which takes a single device
# The guest size the boot was measured with; --smp and --mem still win.
SMP=1
MEM=2G
# On I2C3 (QEMU's i2c-bus.2, Linux's i2c-2): a pca9535 for the device tree's
# pca6416 at 0x20, and a tmp105, a 256-byte 24c02 and a ds1338 for userspace to
# bind with new_device.
QEMU_ARGS=-device pca9535,bus=i2c-bus.2,address=0x20 -device tmp105,bus=i2c-bus.2,address=0x48 -device at24c-eeprom,bus=i2c-bus.2,address=0x50,rom-size=256 -device ds1338,bus=i2c-bus.2,address=0x68
# Kernel config symbols the board needs, each =y or =m in the tree's .config.
KCONFIG=CONFIG_ARCH_MXC CONFIG_CLK_IMX8MP CONFIG_PINCTRL_IMX8MP CONFIG_SERIAL_IMX CONFIG_SERIAL_IMX_CONSOLE CONFIG_FEC
