# The kernel source this tree builds and boots.
SRC=@KBL_WORKSPACE@/mainline-riscv64/kernel
# What this tree is.  Read by every kbuildlab command; never inferred from the
# directory name, so renaming the directory cannot change what gets built.
ARCH=riscv64

# The tag or branch to track.  A tag is pinned and `kbuildlab sync` will say so.
# A stable branch such as linux-6.12.y moves as patches land, which is what
# makes `kbuildlab update` meaningful.
VERSION=master
UPSTREAM=mainline

# QEMU.  Filled in by the arch template; edit freely.

# The kernel image base is deliberately NOT stated here.
#
# On riscv64 it cannot be: arch/riscv/mm/init.c reads `kernel_map.phys_addr =
# (uintptr_t)(&_start)` PC-relatively before the MMU is on, and vmlinux.lds.S
# links at a virtual address, so no physical base exists in the image to read.
# The only guarantee is alignment -- 2MB for rv64, enforced by a BUG_ON in
# mm/init.c -- and 0x80200000 is a loader convention, not a property of the
# kernel.  arm64 and x86_64 are more predictable but not more principled.
#
# So the debugger measures it.  If you need to pin it for a target that cannot
# be introspected, add GDBTOOLS_ENTRY_PA here and say where the number came
# from; a number whose provenance is "it worked last time" is how a session ends
# up calibrated to the wrong address with nothing reporting it.
QEMU_BIN=qemu-system-riscv64
MACHINE=virt,aia=aplic-imsic
CPU=rva23s64
CONSOLE=ttyS0
KERNEL_IMAGE_REL=arch/riscv/boot/Image
GDB_PORT=1336
QMP_PORT=11336

# Root filesystem (buildroot initramfs).
# Boot to a login shell; pass --no-initrd to boot without one (early-boot debug).
INITRD=@KBL_WORKSPACE@/rootfs/riscv64/images/rootfs.cpio.gz

# Paging: embedded riscv = Sv39 (disable Sv48/Sv57). Runtime, no rebuild.
CPU_PAGING=sv48=off,sv57=off

# Firmware boot options. Default is direct (OpenSBI->kernel, clean kernel _start
# debug). --boot uboot boots OpenSBI->u-boot->kernel, but u-boot (S-mode) and the
# kernel both land at 0x80200000 (RAM base + text_offset) so bootbreak stops at
# u-boot _start; use --stop start_kernel to reach the kernel through u-boot.
UBOOT=@KBL_WORKSPACE@/firmware/u-boot/build-riscv64/u-boot.bin
UBOOT_LOADADDR=0x80200000
UBOOT_RDADDR=0x88000000
# The kernel entry of the default (direct) boot. `attach` uses it while the
# guest runs that boot and its run state names no entry: OpenSBI hands off to
# _start at 0x80200000 (RAM base + text_offset), and riscv's entry is _start,
# so no image-base -> entry shift applies. Literal: tree.conf is parsed.
GDBTOOLS_ENTRY_PA=0x80200000

# Persistent per-tree writable disk: a virtio-blk ext4 image kept on SSD between
# runs, auto-mounted by the guest at /persist (init script S45persist). Survives
# reboot; per tree, so the 7 kernels never share state. --no-persist skips it.
PERSIST=1
PERSIST_SIZE=2G
PERSIST_DISK=disk/persist.img
GCC=16
BOOT=uboot
GDBTOOLS_BREAK_KIND=hw
ROOT=disk
LAN_NICS=virtio-net-pci virtio-net-pci
QEMU_ARGS=-device qemu-xhci
STORAGE=emmc
BOOTPART_SIZE=128M
ROOTFS_IMAGE=@KBL_WORKSPACE@/rootfs/riscv64/images/rootfs.ext4
IOMMU=1
