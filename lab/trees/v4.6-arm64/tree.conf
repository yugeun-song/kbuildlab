# The kernel source this tree builds and boots.
SRC=@KBL_WORKSPACE@/v4.6-arm64/kernel
# What this tree is.  Read by every kbuildlab command; never inferred from the
# directory name, so renaming the directory cannot change what gets built.
NAME=v4.6-arm64
ARCH=arm64

# The tag or branch to track.  A tag is pinned and `kbuildlab sync` will say so.
# A stable branch such as linux-6.12.y moves as patches land, which is what
# makes `kbuildlab update` meaningful.
VERSION=v4.6.7
UPSTREAM=stable

# QEMU.  Filled in by the arch template; edit freely.

# The kernel image base is deliberately NOT stated here.
#
# On riscv64 it cannot be: arch/riscv/mm/init.c reads `kernel_map.phys_addr =
# (uintptr_t)(&_start)` PC-relatively before the MMU is on, and vmlinux.lds.S
# links at a virtual address, so no physical base exists in the image to read.
# The only guarantee is alignment -- 2MB for rv64, enforced by a BUG_ON in
# mm/init.c -- and 0x80200000 is a loader convention, not a property of the
# kernel.  arm64 and x86_64 are more predictable but not more principled.
#
# So the debugger measures it.  If you need to pin it for a target that cannot
# be introspected, add GDBTOOLS_ENTRY_PA here and say where the number came
# from; a number whose provenance is "it worked last time" is how a session ends
# up calibrated to the wrong address with nothing reporting it.
# Toolchain.  GCC names the compiler version inside the build image; IMAGE would
# name another image, and this tree needs neither an older one nor an older
# compiler, which is not what its date suggests.
#
# Found by building, not assumed.  Unaided, this 2016 kernel stops at gcc-9:
# gcc-10 turned -fno-common on by default and v4.6's own host tools have
# tentative definitions that then collide, `scripts/dtc` first, on a duplicate
# yylloc.  That is a HOST-tool limit, not a kernel-code one -- with -fcommon on
# the host compiler alone the tree builds all the way up to gcc-16, and its own
# code generation is untouched, which is what makes the flag acceptable here.
# HOSTCC_FLAGS reaches HOSTCC only; nothing in it can reach the kernel objects.
#
# The compiler also decides this tree's DWARF version, because v4.6 has no
# Kconfig choice for it (see config-fragment): gcc-11 and later default to
# DWARF5, so raising the compiler is what buys this kernel the loclists encoding
# the debugger needs to locate variables in optimised code.
GCC=16
HOSTCC_FLAGS=-fcommon

QEMU_BIN=qemu-system-aarch64
MACHINE=virt
CPU=cortex-a72
CONSOLE=ttyAMA0
KERNEL_IMAGE_REL=arch/arm64/boot/Image
GDB_PORT=1435
QMP_PORT=11435

# Root filesystem (buildroot initramfs).
# Boot to a login shell; pass --no-initrd to boot without one (early-boot debug).
INITRD=@KBL_WORKSPACE@/rootfs/arm64/images/rootfs.cpio.gz

# Firmware boot (u-boot).
BOOT=uboot
UBOOT=@KBL_WORKSPACE@/firmware/u-boot/build-arm64/u-boot.bin
UBOOT_LOADADDR=0x40080000
UBOOT_RDADDR=0x48000000
# The kernel entry of the default boot. `attach` uses it while the guest runs
# that boot and its run state names no entry (a guest started elsewhere).
# arm64's ELF entry is _text, so this equals UBOOT_LOADADDR and the
# image-base -> entry shift is a no-op. Literal: tree.conf is parsed.
GDBTOOLS_ENTRY_PA=0x40080000
# u-boot copies the Image to the entry AFTER reset, so a software breakpoint there
# is overwritten before the CPU arrives; the arch default is sw (right for direct
# boot, where the entry is in place at reset). State hw for the u-boot chain, so an
# adapter reading only tree.conf gets the same robust breakpoint the terminal uses.
GDBTOOLS_BREAK_KIND=hw

# Persistent per-tree writable disk: a virtio-blk ext4 image kept on SSD between
# runs, auto-mounted by the guest at /persist (init script S45persist). Survives
# reboot; per tree, so the 7 kernels never share state. --no-persist skips it.
PERSIST=1
PERSIST_SIZE=2G
PERSIST_DISK=disk/persist.img

# Extra kernel command-line words for this tree.  The kernel hands an unrecognised
# key=value to init as an environment variable (init/main.c unknown_bootoption),
# and init passes it on, so this is the only place early enough to reach PID 1.
#
# A 2026 glibc registers rseq(2) in every process it starts.  This 2016 kernel has
# no such syscall, and arm64's do_ni_syscall answers each one with a pr_info plus a
# full x0..x29 register dump to the console.
#
# Measured on this tree, one full boot to the login prompt, counting both the
# printed dumps and the "callbacks suppressed" the kernel's rate limiter reports:
#
#              rseq traps            console lines
#   without      85  (29 + 56)            936
#   with         34  (22 + 12)            761
#
# A reduction, not an elimination, and the residue has two causes that this cannot
# reach.  busybox init does not pass its own environment to its children, so the
# rootfs re-exports the value in /etc/init.d/rcS and /etc/profile.d (see
# rootfs/post-build.sh) -- but busybox `ifup` REPLACES the environment for the
# scripts it runs, so everything under S40network (wait_iface, run-parts, ip,
# sleep) loses it again; and the kernel's own call_usermodehelper modprobe never
# had it.
#
# The kernel-side alternative is `sysctl -w debug.exception-trace=0`, which this
# kernel supports (CONFIG_SYSCTL_EXCEPTION_TRACE=y) and which would silence the
# lot.  It is deliberately NOT set: it also silences the reports for real
# unhandled signals, and on a tree that exists to be debugged that is the wrong
# trade.  Set it in the guest if you want the console quiet.
#
# Stated here rather than in the launcher because it is true of THIS guest's
# userspace-on-old-kernel pairing, not of kbuildlab.
CMDLINE_EXTRA=GLIBC_TUNABLES=glibc.pthread.rseq=0
